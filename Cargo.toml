[workspace]
resolver = "3"
members = [
    "crates/aster-ai",
    "crates/aster-calc",
    "crates/aster-image",
    "crates/aster-layout",
    "crates/aster-markdown",
    "crates/aster-mcp",
    "crates/aster-mcp-bridge",
    "crates/aster-platform",
    "crates/aster-ooxml",
    "crates/aster-pdf",
    "crates/aster-sheets",
    "crates/aster-shell",
    "crates/aster-slides",
    "crates/aster-storage",
    "crates/aster-surface",
    "crates/aster-text",
    "crates/aster-tools",
    "crates/aster-workspace",
    "crates/aster-writer",
    "spikes/g1-ime",
    "spikes/g2-frame",
    "spikes/g3-cjk",
    "spikes/g6-storage",
]
# G4 and G5 build the libraries under evaluation: OOXML codecs and formula
# engines. They take minutes to compile and are not dependencies of the
# product, so each spike is a workspace of its own with its own lock file.
exclude = ["spikes/g4-ooxml", "spikes/g5-formula"]

[workspace.package]
# The one place the product version is written. Packaging reads it from here.
version = "0.0.1"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.95"
publish = false

# Versions are pinned on purpose. Slint's `unstable-*` features and Parley's 0.x
# API both change between minor releases; upgrading means re-running the Phase 0
# gate tests (G1 input method, G2 frame path).
[workspace.dependencies]
aster-ai = { path = "crates/aster-ai" }
aster-calc = { path = "crates/aster-calc" }
aster-markdown = { path = "crates/aster-markdown" }
aster-image = { path = "crates/aster-image" }
aster-layout = { path = "crates/aster-layout" }
aster-mcp = { path = "crates/aster-mcp" }
aster-ooxml = { path = "crates/aster-ooxml" }
aster-pdf = { path = "crates/aster-pdf" }
aster-platform = { path = "crates/aster-platform" }
aster-sheets = { path = "crates/aster-sheets" }
aster-slides = { path = "crates/aster-slides" }
aster-storage = { path = "crates/aster-storage" }
aster-surface = { path = "crates/aster-surface" }
aster-text = { path = "crates/aster-text" }
aster-tools = { path = "crates/aster-tools" }
aster-workspace = { path = "crates/aster-workspace" }
aster-writer = { path = "crates/aster-writer" }
slint = { version = "~1.19.0", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "unstable-winit-030",
    "unstable-fontique-012",
] }
slint-build = "~1.19.0"
parley = { version = "=0.13.0", features = ["bytemuck", "complex-scripts"] }
# 0.2.0 is the version Parley 0.13's own examples build against; newer vello_cpu
# releases exist but their font types have not been checked against Parley 0.13.
vello_cpu = { version = "=0.2.0", default-features = false, features = [
    "std",
    "text",
    "u8_pipeline",
    "png",
    "multithreading",
] }
bytemuck = "1.25"
# The same ICU4X release Parley 0.13 uses, so only one copy of its data is linked.
icu_segmenter = "~2.3.0"
icu_locale_core = "2.3"
# Composing file names before comparing them: macOS may hand them out decomposed.
icu_normalizer = "~2.3.0"
# SQLite is compiled in, so every platform runs the same version.
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3.27"
# Local time for "today 14:20" in the recent-files list. Slint already links it.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Native open and save dialogs on all three systems.
rfd = "~0.18.0"
# Reading and writing files in legacy encodings (GB18030, Shift_JIS, ...).
encoding_rs = "0.8.35"
# The system's language and region, for the paper size of exported PDFs.
sys-locale = "0.3.2"
# Pictures on the macOS clipboard (NSPasteboard), for pasting them into
# Markdown documents. The same versions winit and rfd already use.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
# Moving files to the system trash rather than deleting them.
trash = { version = "5.4", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }
# JSON for the tool layer, MCP and the AI providers' wire formats.
serde_json = "1.0.150"
# The assistant's HTTPS client. Blocking, on the assistant's own thread.
# rustls with ring, and the system's certificate store through the platform
# verifier (webpki-roots is CDLA-licensed, not on the allow list).
ureq = { version = "~3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# API keys live in the system's key store.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
# Peer credentials of local socket connections (getpeereid, SO_PEERCRED).
libc = "0.2"
# CommonMark and GitHub extensions, with its HTML writer for exporting;
# without its command line.
pulldown-cmark = { version = "~0.13.6", default-features = false, features = ["html"] }
# The text of large documents. Only `\n` ends a line: files are normalised to
# it when read.
ropey = { version = "~1.6.1", default-features = false, features = ["simd"] }
# Find and replace: the engine of the `regex` crate, used directly so that a
# search can be confined to a window of the text and cancelled between them.
regex-automata = "~0.4.19"
regex-syntax = "~0.8.12"
# XLSX and PPTX (ADR 0001): our own package layer on these two, the same pair
# the G4 gate measured. Only reading and inflating; nothing is written yet.
zip = { version = "~8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "~0.42.0"
# Pictures in workbooks and presentations. Both were already in the tree
# (through Slint's image loading), so they add no new crates.
png = "~0.18.1"
zune-jpeg = "~0.5.15"
# Exporting Markdown as PDF: embedded, subsetted fonts with ToUnicode maps,
# links and pictures. Without its own shaping: text comes shaped by
# `aster-text`. `raster-images` is what has images at all (and bitmap emoji);
# its decoders were already in the tree through Slint, only `imagesize` is new.
krilla = { version = "~0.8.2", default-features = false, features = ["raster-images"] }
# Viewing PDF files: a rasteriser in Rust on vello_cpu. It needs vello_cpu 0.3
# while Parley 0.13 pins 0.2, so both are built for now. Its default features
# embed the 14 standard fonts (Foxit's, BSD-3-Clause, from PDFium) and Adobe's
# predefined CMaps (BSD-3-Clause), so documents that do not embed them still
# show their text.
hayro = "~0.9.0"
# Inflating PDF streams ourselves, with a ceiling, before hayro sees them. The
# same flate2 and zlib-rs that `zip` already uses.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# The formula engine (ADR 0002), only through `aster-calc`. Exact version: an
# upgrade means re-running G5's measurements and its 69-formula comparison.
formualizer = { version = "=0.15.0", default-features = false, features = ["workbook", "eval", "common", "parse", "system-clock"] }

[profile.dev]
opt-level = 1

# What gets shipped. Thin LTO and one codegen unit trade build time for size and
# speed; symbols are stripped because crash reports will use separate debug files.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
