[package]
name = "aster-pdf"
version.workspace = true
license.workspace = true
description = "Reading and rendering PDF files within limits, on worker threads"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hayro = { workspace = true }
flate2 = { workspace = true }
libc = { workspace = true }

# The child process on its own, for the process tests. The application is
# its own child (`aster-shell --pdf-worker`); this binary is not shipped.
[[bin]]
name = "aster-pdf-worker"
path = "src/bin/aster-pdf-worker.rs"
test = false

[dev-dependencies]
tempfile = { workspace = true }
