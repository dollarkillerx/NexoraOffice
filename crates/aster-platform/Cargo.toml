[package]
name = "aster-platform"
version.workspace = true
license.workspace = true
description = "What Aster Office asks of the operating system: file dialogs, opening links, data folders"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rfd = { workspace = true }
trash = { workspace = true }
sys-locale = { workspace = true }

# Reading pictures from the clipboard (clipboard.rs) and receiving the files
# Finder opens (open_requests.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

# Telling local disks from network ones (volumes.rs).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
