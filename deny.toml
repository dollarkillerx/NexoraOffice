# Dependency policy, enforced by cargo-deny in CI.
# The licence list is deliberately short. Adding to it is a legal decision, not
# a way to make CI pass.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    # Boost. Permissive, no attribution needed in binaries.
    "BSL-1.0",
    # Unicode data tables used by ICU4X.
    "Unicode-3.0",
    # Slint is offered under GPL-3.0, a commercial licence, or this one.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
