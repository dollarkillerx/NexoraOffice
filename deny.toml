# Dependency policy, enforced by cargo-deny in CI.
#
# This project is licensed AGPL-3.0-only. A dependency is acceptable when its
# licence lets its code be combined into an AGPL-3.0 work: the permissive
# licences below, and GPL-3.0, which section 13 of both licences allows to be
# linked with AGPL-3.0 code. GPL-2.0-only code is not compatible and is not
# listed. The list is deliberately short. Adding to it is a legal decision, not a
# way to make CI pass.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    # Boost. Permissive, no attribution needed in binaries.
    "BSL-1.0",
    # Unicode data tables used by ICU4X.
    "Unicode-3.0",
    # Slint is offered under GPL-3.0-only, a royalty-free licence with usage
    # restrictions, or a commercial one. An AGPL project has to take the GPL
    # option: the royalty-free licence restricts fields of use, which the AGPL
    # does not allow us to pass on.
    "GPL-3.0-only",
]

# Our own crates are not published and carry the project licence.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, without a version: the version
# is written once, in the workspace manifest. They are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
